---
# Implement AWS CLI installation and credential configuration
# This workload supports two modes:
# 1. Bastion mode (wetty terminal) - installs on bastion host
# 2. Showroom pod mode - execs into showroom pod to install

- name: Setting up AWS CLI workload
  debug:
    msg: "Setting up AWS CLI for user {{ student_name | default('lab-user') }}"

# =============================================================================
# BASTION MODE: Install on bastion host (for wetty terminal)
# =============================================================================
- name: Install AWS CLI on bastion (wetty terminal mode)
  when: ocp4_days_workload_aws_cli_bastion_mode | default(true) | bool
  block:
    - name: Get awscli bundle
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Create temp directory for awscli
      file:
        path: /tmp/awscli-install
        state: directory
        mode: '0755'

    - name: Unzip awscliv2.zip
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/awscli-install/
        remote_src: true

    - name: Install awscli
      become: true
      command: /tmp/awscli-install/aws/install --update
      args:
        creates: /usr/local/bin/aws

    - name: Cleanup archive and tmp files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscli-install
        - /tmp/awscliv2.zip

    - name: Verify AWS CLI installation
      command: /usr/local/bin/aws --version
      register: r_aws_version
      changed_when: false

    - name: Display AWS CLI version
      debug:
        msg: "AWS CLI installed: {{ r_aws_version.stdout }}"

# =============================================================================
# CONFIGURE AWS CREDENTIALS FOR ALL USERS
# =============================================================================
- name: Configure AWS credentials for bastion users
  when:
    - ocp4_days_workload_aws_cli_bastion_mode | default(true) | bool
    - sandbox_aws_access_key_id | default('') | length > 0
    - sandbox_aws_secret_access_key | default('') | length > 0
  block:
    - name: Create .aws directory for each user
      become_user: "{{ item }}"
      become: true
      file:
        path: "~/.aws"
        state: directory
        mode: '0700'
      loop: "{{ ocp4_days_workload_aws_cli_users }}"

    - name: Add AWS credentials for each user
      become_user: "{{ item }}"
      become: true
      no_log: true
      copy:
        dest: "~/.aws/credentials"
        mode: '0600'
        content: |
          [default]
          aws_access_key_id={{ sandbox_aws_access_key_id }}
          aws_secret_access_key={{ sandbox_aws_secret_access_key }}
      loop: "{{ ocp4_days_workload_aws_cli_users }}"

    - name: Add AWS config for each user
      become_user: "{{ item }}"
      become: true
      copy:
        dest: "~/.aws/config"
        mode: '0600'
        content: |
          [default]
          region={{ ocp4_days_workload_aws_cli_region }}
          output=json
      loop: "{{ ocp4_days_workload_aws_cli_users }}"

    - name: Verify AWS credentials
      command: /usr/local/bin/aws sts get-caller-identity
      register: r_aws_identity
      changed_when: false
      ignore_errors: true

    - name: Display AWS identity
      debug:
        msg: "AWS identity: {{ r_aws_identity.stdout | default('Could not verify') }}"
      when: r_aws_identity.rc == 0

# =============================================================================
# SHOWROOM POD MODE: Exec into showroom pod to install (alternative)
# =============================================================================
- name: Install AWS CLI in showroom pod (container mode)
  when: ocp4_days_workload_aws_cli_pod_mode | default(false) | bool
  block:
    - name: Get showroom pod name
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ocp4_days_workload_aws_cli_showroom_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=showroom
      register: r_showroom_pods

    - name: Try alternative label if primary not found
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ocp4_days_workload_aws_cli_showroom_namespace }}"
        label_selectors:
          - app=showroom
      register: r_showroom_pods_alt
      when: r_showroom_pods.resources | length == 0

    - name: Set showroom pod info
      set_fact:
        _showroom_pod: >-
          {{ (r_showroom_pods.resources | default([]))[0]
             if r_showroom_pods.resources | default([]) | length > 0
             else (r_showroom_pods_alt.resources | default([]))[0]
             if r_showroom_pods_alt.resources | default([]) | length > 0
             else {} }}
      when: (r_showroom_pods.resources | default([]) | length > 0) or
            (r_showroom_pods_alt.resources | default([]) | length > 0)

    - name: Set showroom pod name
      set_fact:
        _showroom_pod_name: "{{ _showroom_pod.metadata.name | default('') }}"
        _showroom_all_containers: "{{ _showroom_pod.spec.containers | default([]) | map(attribute='name') | list }}"
      when: _showroom_pod | default({}) | length > 0

    # Look for a terminal container - these are the ones that have bash/shell
    - name: Find terminal container
      set_fact:
        _showroom_container_name: >-
          {{ item }}
      when:
        - _showroom_pod | default({}) | length > 0
        - item in _showroom_all_containers | default([])
      loop:
        - terminal
        - wetty
        - ttyd
        - showroom-terminal

    # If no terminal container found, the pod mode won't work
    - name: Warn if showroom pod not found
      debug:
        msg: "WARNING: Could not find showroom pod in namespace {{ ocp4_days_workload_aws_cli_showroom_namespace }}. Skipping AWS CLI configuration."
      when: _showroom_pod_name | default('') | length == 0

    - name: Warn if no terminal container found
      debug:
        msg: >-
          WARNING: Showroom pod {{ _showroom_pod_name }} does not have a terminal container
          (found containers: {{ _showroom_all_containers | join(', ') }}).
          Pod mode requires a terminal container (terminal, wetty, ttyd, showroom-terminal).
          Skipping AWS CLI configuration in pod. Consider using bastion mode instead.
      when:
        - _showroom_pod_name | default('') | length > 0
        - _showroom_container_name | default('') | length == 0

    - name: Debug showroom pod info
      debug:
        msg: "Found showroom pod {{ _showroom_pod_name }} with terminal container {{ _showroom_container_name }}"
      when:
        - _showroom_pod_name | default('') | length > 0
        - _showroom_container_name | default('') | length > 0

    # Wait for the pod to be ready before trying to exec
    - name: Wait for showroom pod to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ocp4_days_workload_aws_cli_showroom_namespace }}"
        name: "{{ _showroom_pod_name }}"
      register: r_showroom_pod_status
      until:
        - r_showroom_pod_status.resources | length > 0
        - r_showroom_pod_status.resources[0].status.phase == 'Running'
        - r_showroom_pod_status.resources[0].status.containerStatuses is defined
        - r_showroom_pod_status.resources[0].status.containerStatuses | selectattr('name', 'equalto', _showroom_container_name) | selectattr('ready', 'equalto', true) | list | length > 0
      retries: 30
      delay: 10
      when:
        - _showroom_pod_name | default('') | length > 0
        - _showroom_container_name | default('') | length > 0

    - name: Install AWS CLI in showroom pod
      kubernetes.core.k8s_exec:
        namespace: "{{ ocp4_days_workload_aws_cli_showroom_namespace }}"
        pod: "{{ _showroom_pod_name }}"
        container: "{{ _showroom_container_name }}"
        command: >-
          bash -c '
          if ! command -v aws &> /dev/null; then
            cd /tmp &&
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" &&
            unzip -q awscliv2.zip &&
            ./aws/install -i /tmp/aws-cli -b /tmp/bin &&
            rm -rf awscliv2.zip aws &&
            echo "AWS CLI installed to /tmp/bin - add to PATH with: export PATH=\$PATH:/tmp/bin"
          fi
          '
      when:
        - _showroom_pod_name | default('') | length > 0
        - _showroom_container_name | default('') | length > 0
      ignore_errors: true

    - name: Configure AWS credentials in showroom pod
      kubernetes.core.k8s_exec:
        namespace: "{{ ocp4_days_workload_aws_cli_showroom_namespace }}"
        pod: "{{ _showroom_pod_name }}"
        container: "{{ _showroom_container_name }}"
        command: >-
          bash -c 'mkdir -p /tmp/.aws &&
          echo "[default]" > /tmp/.aws/credentials &&
          echo "aws_access_key_id={{ sandbox_aws_access_key_id }}" >> /tmp/.aws/credentials &&
          echo "aws_secret_access_key={{ sandbox_aws_secret_access_key }}" >> /tmp/.aws/credentials &&
          chmod 600 /tmp/.aws/credentials &&
          echo "[default]" > /tmp/.aws/config &&
          echo "region={{ ocp4_days_workload_aws_cli_region }}" >> /tmp/.aws/config &&
          echo "output=json" >> /tmp/.aws/config &&
          chmod 600 /tmp/.aws/config &&
          echo "export AWS_CONFIG_FILE=/tmp/.aws/config" > /tmp/aws-env.sh &&
          echo "export AWS_SHARED_CREDENTIALS_FILE=/tmp/.aws/credentials" >> /tmp/aws-env.sh &&
          chmod 755 /tmp/aws-env.sh'
      when:
        - _showroom_pod_name | default('') | length > 0
        - _showroom_container_name | default('') | length > 0
        - sandbox_aws_access_key_id | default('') | length > 0
        - sandbox_aws_secret_access_key | default('') | length > 0
      no_log: true
      ignore_errors: true

# Leave this as the last task in the playbook
- name: Workload tasks complete
  debug:
    msg: "AWS CLI Workload Tasks completed successfully."
  when: not silent | bool
